<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Chuyển Khoản - Quản Lý Vay</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/user">
                <img src="images/logo.png" alt="Logo" width="40" class="me-2 rounded-circle bg-white" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\' viewBox=\'0 0 40 40\'><circle cx=\'20\' cy=\'20\' r=\'20\' fill=\'%230d6efd\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'central\' text-anchor=\'middle\' fill=\'white\' font-size=\'16\' font-weight=\'bold\'>A</text></svg>'">
                <span class="fw-bold">Cổng Thông Tin Khoản Vay</span>
            </a>
            <div class="d-flex">
                <a href="/user" class="btn btn-outline-light btn-sm me-2">
                    <i class="fas fa-arrow-left me-1"></i>Quay Lại
                </a>
                <button class="btn btn-outline-danger btn-sm" id="btnLogout">
                    <i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h3 class="fw-bold mb-1"><i class="fas fa-university me-2"></i>Thông Tin Chuyển Khoản Thanh Toán</h3>
                        <p class="mb-0 text-white-50">Vui lòng sử dụng thông tin bên dưới để thực hiện giao dịch</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        
                        <ul class="list-group list-group-flush fs-5">
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <span class="text-muted"><i class="fas fa-user-tie me-2 text-primary"></i>Tên nhân viên phụ trách:</span>
                                <span class="fw-bold text-danger" id="transferStaffName">Vui lòng chờ</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <span class="text-muted"><i class="fas fa-phone-alt me-2 text-primary"></i>RM:</span>
                                <span class="fw-bold">(84-24)3767 4050</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <span class="text-muted"><i class="fas id-badge me-2 text-primary"></i>Mã phụ trách nợ:</span>
                                <span class="fw-bold">007-9011</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <span class="text-muted"><i class="fas fa-shield-alt me-2 text-primary"></i>Hỗ trợ nợ xấu:</span>
                                <span class="badge bg-success fs-6 px-3 py-2">Đang hỗ trợ</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3 border-bottom-0">
                                <span class="text-muted"><i class="fas fa-credit-card me-2 text-primary"></i>Số tài khoản:</span>
                                <span class="fw-bold text-danger" id="transferAccountNumber">Vui lòng chờ</span>
                            </li>
                        </ul>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/transfer.js"></script>
</body>
</html>
