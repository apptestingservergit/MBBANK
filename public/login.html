<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Vay</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS chung -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* CSS riêng cho trang đăng nhập để form nằm chính giữa màn hình */
        body {
            background-color: #e9ecef;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .input-group-text {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 mx-3">
        <div class="text-center mb-4">
            <!-- Thay đường dẫn logo bằng file của bạn -->
            <img src="images/logo.png" alt="Logo" width="70" class="mb-3 rounded-circle shadow-sm" onerror="this.src='https://via.placeholder.com/70'">
            <h4 class="fw-bold text-primary">Cổng Đăng Nhập</h4>
            <p class="text-muted small">Hệ thống quản lý khoản vay</p>
        </div>

        <!-- Khung thông báo lỗi (mặc định ẩn) -->
        <div id="loginAlert" class="alert alert-danger d-none py-2 text-center" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text text-muted"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Nhập tài khoản...." required autocomplete="off">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu...." required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="btnLogin">
                <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
            </button>
        </form>


    </div>

    <!-- Script JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
