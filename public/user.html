<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Người Dùng - Quản Lý Vay</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar có Logo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="images/logo.png" alt="Logo" width="40" class="me-2 rounded-circle bg-white" onerror="this.src='https://via.placeholder.com/40'">
                <span class="fw-bold">Cổng Thông Tin Khoản Vay</span>
            </a>
            <button class="btn btn-outline-light btn-sm" id="btnLogout">
                <i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        
        <!-- Tiêu đề chào mừng -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="p-4 bg-white rounded shadow-sm border-start border-primary border-4">
                    <h3 class="fw-bold text-dark mb-1">Xin chào, Bao!</h3>
                    <p class="text-muted mb-0">Dưới đây là thông tin chi tiết về các khoản vay và lịch sử giao dịch của bạn.</p>
                </div>
            </div>
        </div>

        <!-- Thống kê tổng quan số tiền -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="p-3 bg-white shadow-sm d-flex justify-content-around align-items-center rounded border-top border-primary border-4">
                    <div>
                        <h4 class="fs-3 fw-bold text-primary mb-0" id="userTotalBorrowed">0đ</h4>
                        <p class="text-muted mb-0 small uppercase fw-semibold">Tổng Đã Vay</p>
                    </div>
                    <i class="fas fa-wallet fs-1 text-primary p-3 bg-light rounded-circle"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-white shadow-sm d-flex justify-content-around align-items-center rounded border-top border-success border-4">
                    <div>
                        <h4 class="fs-3 fw-bold text-success mb-0" id="userTotalPaid">0đ</h4>
                        <p class="text-muted mb-0 small uppercase fw-semibold">Tổng Đã Trả</p>
                    </div>
                    <i class="fas fa-check-circle fs-1 text-success p-3 bg-light rounded-circle"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-3 bg-white shadow-sm d-flex justify-content-around align-items-center rounded border-top border-danger border-4">
                    <div>
                        <h4 class="fs-3 fw-bold text-danger mb-0" id="userTotalRemaining">0đ</h4>
                        <p class="text-muted mb-0 small uppercase fw-semibold">Cần Trả Còn Lại</p>
                    </div>
                    <i class="fas fa-hand-holding-usd fs-1 text-danger p-3 bg-light rounded-circle"></i>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Bảng Danh Sách Khoản Vay -->
            <div class="col-lg-7 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-primary"><i class="fas fa-list-alt me-2"></i>Chi Tiết Các Khoản Vay</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tên Khoản Vay</th>
                                        <th>Số Tiền Vay</th>
                                        <th>Đã Trả</th>
                                        <th>Còn Lại</th>
                                        <th>Trạng Thái</th>
                                    </tr>
                                </thead>
                                <tbody id="userLoanTableBody">
                                    <!-- Render bằng JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bảng Lịch Sử Chuyển Khoản -->
            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-success"><i class="fas fa-history me-2"></i>Lịch Sử Chuyển Khoản</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Số Tiền</th>
                                        <th>Thời Gian</th>
                                        <th>Nội Dung</th>
                                    </tr>
                                </thead>
                                <tbody id="userTranTableBody">
                                    <!-- Render bằng JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS & User JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
